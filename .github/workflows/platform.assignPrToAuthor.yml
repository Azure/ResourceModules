name: '.Platform: Assign Pull Request to Author'
on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  id-token: write

jobs:
  autoassign:
    runs-on: ubuntu-latest
    steps:
      - uses: kentaro-m/auto-assign-action@v1.2.4
        with:
          configuration-path: '.github/platform.assignPrToAuthor.configuration.yml'
